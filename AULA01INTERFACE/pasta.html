<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
</head>
<body>
    <h2>Login</h2>

    <form onsubmit="return false;">
        <label for="cpf">CPF*</label><br>
        <input type="text" id="cpf" name="cpf" required placeholder="Digite seu CPF">
        <br><br>

        <label for="senha">Senha*</label><br>
        <input type="password" id="senha" name="senha" required placeholder="Digite sua Senha">

        <div>
            <br><input type="checkbox" id="lembrar" name="lembrar">
            <label for="lembrar">Lembrar Senha</label>
        </div>

        <button type="submit" class="btn-primary-entrar">Entrar</button>
        <a href="esqueceusenha.html" class="link">Esqueceu sua Senha</a>
        <br><br>
        <a href="cadastro.html" class="link">Não tem conta? Cadastre-se</a>
    </form>
</body>
</html>
