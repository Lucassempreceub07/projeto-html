<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Cadastro</title>
</head>
<body>
    <h2>Cadastro</h2>

    <form onsubmit="return false;">
        <label for="nome">Nome*</label><br>
        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
        <br><br>

        <label for="numero">Número*</label><br>
        <input type="tel" id="numero" name="numero" required placeholder="(61) 99999-9999">
        <br><br>

        <label for="email">E-mail*</label><br>
        <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
        <br><br>

        <label for="senha">Crie sua senha*</label><br>
        <input type="password" id="senha" name="senha" required placeholder="Crie sua senha">
        <br><br>

        <button type="submit" class="btn-primary-entrar">Cadastrar</button>
        <a href="pasta.html" class="link">Já tem conta? Entrar</a>
    </form>
</body>
</html>
