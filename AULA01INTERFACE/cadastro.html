<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Cadastro</title>
</head>
<body>
    <h2>Cadastro</h2>

    <form onsubmit="validarCadastro(event)">
        <label for="nome">Nome*</label><br>
        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
        <br><br>

        <label for="numero">Número*</label><br>
        <input type="tel" id="numero" name="numero" required placeholder="(61) 99999-9999">
        <br><br>

        <label for="email">E-mail*</label><br>
        <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
        <br><br>

        <label for="senha">Senha*</label><br>
        <input type="password" id="senha" name="senha" required minlength="6" placeholder="Digite sua Senha">
        <br><br>

        <label for="confirmarsenha">Confirmar Senha*</label><br>
        <input type="password" id="confirmarsenha" name="confirmarsenha" required placeholder="Digite a senha novamente">
        <br><br>

        <button type="submit" class="btn-primary-entrar">Cadastrar</button>
        <a href="pasta.html" class="link">Já tem conta? Entrar</a>
    </form>

    <script>
        function validarCadastro(event) {
            event.preventDefault();
            const senha = document.getElementById("senha").value;
            const confirmar = document.getElementById("confirmarsenha").value;

            if (senha !== confirmar) {
                alert("As senhas não são iguais!");
                return;
            }
            alert("Cadastro realizado!");
        }
    </script>
</body>
</html>
